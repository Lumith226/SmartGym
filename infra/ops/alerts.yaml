groups:
  - name: smartgym
    rules:
      - alert: SmartGymWebTelemetryMissing
        expr: absent_over_time(smartgym_http_requests_total{service_name="web"}[2m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Web probe or telemetry export is unavailable
      - alert: SmartGymServerErrors
        expr: sum by (service_name) (rate(smartgym_http_requests_total{status_class="5xx"}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Sustained server errors
      - alert: SmartGymServerLatency
        expr: histogram_quantile(0.95, sum by (le, service_name) (rate(smartgym_http_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Server p95 latency is above two seconds
      - alert: SmartGymOutboxDelayed
        expr: max by (service_name) (smartgym_outbox_oldest_seconds) > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Oldest pending outbox event is above two minutes
