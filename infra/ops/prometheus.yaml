global:
  evaluation_interval: 15s
otlp:
  promote_resource_attributes: [service.name, service.instance.id]
storage:
  tsdb:
    out_of_order_time_window: 5m
rule_files:
  - /otel-lgtm/smartgym-alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
