# Optional adapter only. Obtain/run the model provider separately and configure matching mTLS.
services:
  pose:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      POSE_LIVE_ENABLED: "true"
      POSE_UPLOAD_ENABLED: "true"
      POSE_ENGINE_ORIGIN: ${SMARTGYM_POSE_ENGINE_ORIGIN:?Set the external HTTPS pose provider}
  pose-worker:
    profiles: !reset []
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      POSE_ENGINE_ORIGIN: ${SMARTGYM_POSE_ENGINE_ORIGIN:?Set the external HTTPS pose provider}
  web:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      BFF_POSE_LIVE_ENABLED: "true"
      BFF_POSE_STUDIO_ENGINE_ORIGIN: ${SMARTGYM_POSE_ENGINE_ORIGIN:?Set the external HTTPS pose provider}
