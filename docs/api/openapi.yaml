            "type": "array",
            "items": {
              "type": "integer",
              "minimum": 1,
              "maximum": 7
            },
            "minItems": 1,
            "maxItems": 7,
            "uniqueItems": true
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "recurrence": {
                  "const": "WEEKLY"
                }
              }
            },
            "then": {
              "required": [
                "weekdays"
              ]
            },
            "else": {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "weekdays"
                    ]
                  },
                  {
                    "required": [
                      "endDate"
                    ]
                  }
                ]
              }
            }
          }
        ]
      },
