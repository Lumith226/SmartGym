        "allOf": [
          {
            "if": {
              "properties": {
                "repCountStatus": {
                  "const": "UNAVAILABLE"
                }
              },
              "required": [
                "repCountStatus"
              ]
            },
            "then": {
              "properties": {
                "repCount": {
                  "type": "null"
                },
                "reps": {
                  "maxItems": 0
                }
              }
            },
            "else": {
              "properties": {
                "repCount": {
                  "type": "integer"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "source": {
                  "const": "VIDEO"
                }
              },
              "required": [
                "source"
              ]
            },
            "then": {
              "properties": {
                "repCountStatus": {
                  "const": "UNAVAILABLE"
                }
              }
            }
          }
        ]
